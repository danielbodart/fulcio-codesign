name: CI

on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Test
        run: zig build test

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          TARBALL="fulcio-codesign-${VERSION}-aarch64-apple-darwin.tar.gz"
          tar -czf "$TARBALL" -C zig-out/bin fulcio-codesign
          shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Integration test
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Sign the tool's own binary with Fulcio as a self-test
          ./zig-out/bin/fulcio-codesign \
            --identifier dev.sigstore.fulcio-codesign-test \
            zig-out/bin/fulcio-codesign
          codesign --verify zig-out/bin/fulcio-codesign

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            "$TARBALL" "$TARBALL.sha256" \
            --title "$TAG_NAME" \
            --generate-notes
