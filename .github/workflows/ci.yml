name: CI

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Test
        run: zig build test

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Version
        id: version
        run: |
          REVISIONS=$(git rev-list --count HEAD)
          VERSION="0.${REVISIONS}.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Integration test
        if: github.ref == 'refs/heads/trunk'
        run: |
          # Sign the tool's own binary with Fulcio as a self-test
          ./zig-out/bin/fulcio-codesign \
            --identifier dev.sigstore.fulcio-codesign-test \
            zig-out/bin/fulcio-codesign
          codesign --verify zig-out/bin/fulcio-codesign

      - name: Package
        if: github.ref == 'refs/heads/trunk'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TARBALL="fulcio-codesign-${VERSION}-aarch64-apple-darwin.tar.gz"
          tar -czf "$TARBALL" -C zig-out/bin fulcio-codesign
          shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Release
        if: github.ref == 'refs/heads/trunk'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --format="- %s" "$PREV_TAG"..HEAD)
          else
            NOTES=$(git log --format="- %s")
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            "$TARBALL" "$TARBALL.sha256" \
            --title "$TAG" \
            --notes "$NOTES"
